name: "IaC Security Gate"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write   # Necesario para subir SARIF a Code Scanning

jobs:
  security-scan:
    name: Checkov & ansible-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas (versiones fijas)
        run: |
          python -m pip install --upgrade pip
          # Versiones fijas para garantizar reproducibilidad
          pip install checkov==3.4.5 ansible-core==2.22.0 ansible-lint==26.11.0

      # --- GATE 1: CHECKOV ---
      - name: "Gate Checkov: Terraform, Ansible y Dockerfile"
        run: |
          checkov -d infra -d ansible -f docker/Dockerfile \
            --external-checks-dir politicas \
            --compact --quiet

      # --- GATE 2: ANSIBLE-LINT ---
      - name: "Gate ansible-lint: Perfil producción"
        run: |
          ansible-lint --profile production ansible/

      # --- REPORTE SARIF (se ejecuta siempre, incluso si los gates fallan) ---
      - name: "Checkov: Generar SARIF"
        if: always()
        run: |
          checkov -d infra -d ansible -f docker/Dockerfile \
            --external-checks-dir politicas \
            -o sarif --output-file-path reportes --soft-fail

      - name: Subir SARIF de Checkov
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reportes/results_sarif.sarif
          category: checkov

      - name: "ansible-lint: Generar SARIF"
        if: always()
        run: |
          cd ansible
          ansible-lint --format sarif --sarif-file ../ansible-lint.sarif site.yml

      - name: Subir SARIF de ansible-lint
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ansible-lint.sarif
          category: ansible-lint