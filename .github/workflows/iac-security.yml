name: "IaC Security Gate"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write   # Necesario para subir SARIF a Code Scanning

jobs:
  security-scan:
    name: Checkov & ansible-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas (versiones compatibles con Python 3.11)
        run: |
          python -m pip install --upgrade pip
          pip install checkov==3.4.5 ansible-core==2.19.6 ansible-lint==25.6.1

      # --- GATE 1: CHECKOV ---
      - name: "Gate Checkov: Terraform, Ansible y Dockerfile"
        run: |
          checkov -d infra -d ansible -f docker/Dockerfile \
            --external-checks-dir politicas \
            --compact --quiet

      # --- GATE 2: ANSIBLE-LINT ---
      - name: "Gate ansible-lint: Perfil producción"
        run: |
          ansible-lint --profile production ansible/

      # --- REPORTE SARIF (se ejecuta siempre, incluso si los gates fallan) ---
      - name: "Checkov: Generar SARIF"
        if: always()
        run: |
          checkov -d infra -d ansible -f docker/Dockerfile \
            --external-checks-dir politicas \
            -o sarif --output-file-path reportes --soft-fail

      - name: Subir SARIF de Checkov
        if: always()
        uses: github/codeql-action/upload-sarif@v4   # Actualizado a v4
        with:
          sarif_file: reportes/results_sarif.sarif
          category: checkov

      - name: "ansible-lint: Generar SARIF"
        if: always()
        run: |
          cd ansible
          # --sarif-file es suficiente; --format sarif es opcional pero no estorba
          ansible-lint --format sarif --sarif-file "$GITHUB_WORKSPACE/ansible-lint.sarif" site.yml || true
          # Si ansible-lint no creó el archivo (porque no hubo hallazgos), creamos un SARIF vacío válido
          if [ ! -f "$GITHUB_WORKSPACE/ansible-lint.sarif" ]; then
            echo '{"version": "2.1.0", "runs": []}' > "$GITHUB_WORKSPACE/ansible-lint.sarif"
          fi

      - name: Subir SARIF de ansible-lint
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ansible-lint.sarif
          category: ansible-lint